<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06050c" />
    <title>Skepnad – live-avatar & röststudio</title>
    <meta name="description" content="Bli vem du vill – live. Avatarer, röstförvrängning, levande bakgrunder, filter och AR för streaming." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div class="bgfx" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="floor"></div>
      <div class="grain"></div>
    </div>

    <section class="splash" id="splash">
      <div class="splash-inner">
        <canvas class="splash-logo" id="splash-logo" aria-hidden="true"></canvas>
        <h1 class="wordmark">SKEPNAD</h1>
        <p class="tagline">Bli <b>vem du vill</b>. Se ut och låt som någon annan – live.</p>
        <div class="feature-chips">
          <span><b>11</b> levande platser</span>
          <span><b>21</b> röster</span>
          <span><b>7</b> 3D-avatarer + VRM</span>
          <span><b>20</b> AR-tillbehör</span>
          <span><b>19</b> filter</span>
          <span><b>16</b> ljudeffekter</span>
        </div>
        <div class="cta" id="cta">
          <button class="btn btn-primary big" data-start="full" data-tip="Starta|Kameran och mikrofonen startas. Webbläsaren frågar om lov första gången.">
            Starta kamera &amp; mikrofon
          </button>
          <div class="cta-row">
            <button class="btn" data-start="avatar" data-tip="Bara mikrofon|Utan kamera: välj en avatar – munnen följer din röst.">Bara mikrofon (avatar)</button>
            <button class="btn btn-ghost" data-start="demo" data-tip="Demoläge|Utforska appen utan kamera och mikrofon. En demoröst pratar åt dig.">Demoläge</button>
          </div>
        </div>
        <div class="loadbar" id="loadbar" hidden>
          <div class="track"><div class="fill" id="loadfill"></div></div>
          <p id="loadtext">Förbereder…</p>
        </div>
        <p class="privacy">🔒 Allt körs lokalt i din dator – ingen bild eller ljud skickas någonstans.</p>
      </div>
    </section>

    <div class="app" id="app" hidden>
      <header class="topbar">
        <div class="brand" data-tip="Skepnad|Live-avatar, röstförvrängare och kamerafilter för streaming.">
          <canvas id="brand-logo" aria-hidden="true"></canvas>
          <div class="brand-text"><b>SKEPNAD</b><span>LIVE STUDIO</span></div>
        </div>
        <div class="status" id="status"></div>
        <div class="actions" id="actions"></div>
      </header>
      <nav class="rail" id="rail" aria-label="Flikar"></nav>
      <main class="main">
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <canvas id="out" aria-label="Förhandsvisning av sändningen"></canvas>
            <div class="reflection"></div>
            <div class="stage-badges" id="stage-badges"></div>
            <div class="stage-hint fade" id="stage-hint"></div>
          </div>
        </div>
        <div class="quickbar" id="quickbar"></div>
        <div class="dock" id="dock" aria-label="Skepnader"></div>
      </main>
      <aside class="panel" id="panel">
        <div class="panel-head"><h2 id="panel-title"></h2><p id="panel-sub"></p></div>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
